services:
  miaowu:
    image: miaowu:local
    build: .
    container_name: miaowu
    restart: unless-stopped
    # host 模式:与妙妙屋X 同理 —— agent 反向连接、未来多端口入站都不用反复改端口映射
    network_mode: host
    environment:
      - PORT=${PORT:-12889}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-12889}/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
